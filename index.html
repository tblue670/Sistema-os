<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sistema OS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Sistema Operativo Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: scrivania a tutto schermo + barra in basso; finestre libere su PC (aggancio ai bordi), a schermo intero su schermi stretti */
:root{
  --win:#f7f8f9; --win-2:#eceff2; --fg:#1b2127; --muted:#5f6b76; --line:#d5dbe1;
  --accent:#1f6f8b; --accent-fg:#ffffff; --accent-soft:#dbeaf0; --danger:#b3261e; --ok:#2e7d4f; --warn:#a86a00;
  --bar:rgba(246,248,250,.88); --shadow:0 18px 50px rgba(10,20,30,.28),0 2px 6px rgba(10,20,30,.18);
  --wall-fg:#ffffff; --glass:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.22);
  --note-1:#fff4c2; --note-2:#dff1e3; --note-3:#dcebf7; --note-4:#f7e1e6; --note-fg:#2a2a22;
  --ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --win:#1d2328; --win-2:#262d33; --fg:#e7ebee; --muted:#9aa6b0; --line:#36404a;
  --accent:#5fb3cf; --accent-fg:#0d1a20; --accent-soft:#1f3a45; --danger:#f2867e; --ok:#72c79a; --warn:#e3b04f;
  --bar:rgba(22,27,31,.88); --shadow:0 18px 50px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  --note-1:#4a4428; --note-2:#2c4232; --note-3:#2a3c4c; --note-4:#4a2f36; --note-fg:#f1eee2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --win:#1d2328; --win-2:#262d33; --fg:#e7ebee; --muted:#9aa6b0; --line:#36404a;
  --accent:#5fb3cf; --accent-fg:#0d1a20; --accent-soft:#1f3a45; --danger:#f2867e; --ok:#72c79a; --warn:#e3b04f;
  --bar:rgba(22,27,31,.88); --shadow:0 18px 50px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  --note-1:#4a4428; --note-2:#2c4232; --note-3:#2a3c4c; --note-4:#4a2f36; --note-fg:#f1eee2;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--win-2);color:var(--fg);font-family:var(--ui);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

#os{height:100%;display:grid;grid-template-rows:1fr auto;position:relative}
#desk{position:relative;overflow:hidden;min-height:0}
.wall-ardesia{background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 10px),radial-gradient(120% 90% at 85% 5%,#56616c 0%,#2f363e 55%,#1d2227 100%)}
.wall-mare{background:radial-gradient(60% 30% at 70% 38%,rgba(255,240,210,.35),transparent 70%),linear-gradient(180deg,#a9cbd6 0%,#6aa2b6 36%,#2b6c86 37%,#174a63 70%,#0e3247 100%)}
.wall-ulivo{background:radial-gradient(70% 60% at 20% 85%,#7c8a59 0%,#4c5737 55%,#30381f 100%)}
#desk.drop::after{content:"Rilascia qui i file per salvarli nell’archivio";position:absolute;inset:12px;border:2px dashed var(--wall-fg);border-radius:14px;display:grid;place-items:center;color:var(--wall-fg);font-weight:600;background:rgba(0,0,0,.35);z-index:4000;pointer-events:none}

#icons{position:absolute;inset:0 auto 0 0;right:0;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(auto-fill,88px);grid-auto-rows:98px;gap:6px;align-content:start;justify-content:start;overflow:auto}
@media (min-width:980px){#icons{right:300px}}
.dicon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:0;border-radius:10px;background:transparent;color:var(--wall-fg);text-align:center;font-size:12.5px;font-weight:500;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.7);overflow:hidden}
.dicon:hover{background:rgba(255,255,255,.12)}
.tile{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.93);color:#1f4f63;box-shadow:0 4px 12px rgba(0,0,0,.3);flex:none;font-weight:700;font-size:17px;text-shadow:none;letter-spacing:.02em}
.tile svg.i{width:26px;height:26px}
.tile.sm{width:30px;height:30px;border-radius:8px;font-size:12px;box-shadow:none}
.tile.sm svg.i{width:18px;height:18px}
.dicon .lbl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}

/* Widget */
#widgets{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px));width:268px;display:none;flex-direction:column;gap:12px;color:var(--wall-fg)}
@media (min-width:980px){#widgets{display:flex}}
.wg{background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.wg h3{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.85}
.wg-clock b{display:block;font-family:var(--mono);font-size:40px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.wg-clock span{display:block;margin-top:6px;font-size:13px;text-transform:capitalize;opacity:.9}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.wg li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.wg li time{font-family:var(--mono);font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.wg li span{overflow-wrap:anywhere}
.wg .pin{font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.12)}
.wg .none{font-size:13px;opacity:.75}

/* Finestre */
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:280px;min-height:200px}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win-head{display:flex;align-items:center;gap:10px;height:42px;padding:0 6px 0 12px;background:var(--win-2);border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:none;flex:none;position:relative}
.win.active .win-head{background:var(--accent-soft)}
.win-title{flex:1;min-width:0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-btn{width:34px;height:30px;border:0;border-radius:7px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.win-btn:hover{background:var(--line);color:var(--fg)}
.win-btn.close:hover{background:var(--danger);color:#fff}
.win-btn svg.i{width:16px;height:16px}
.win-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;position:relative}
.win-body iframe{flex:1;width:100%;border:0;background:#fff;display:block}
.win.moving iframe{pointer-events:none}
.grip{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,var(--line) 55% 62%,transparent 62% 72%,var(--line) 72% 79%,transparent 79%)}
.win.max .grip{display:none}
#snap{position:absolute;border-radius:12px;background:rgba(95,179,207,.22);border:2px solid rgba(95,179,207,.85);pointer-events:none;z-index:3999;transition:all .08s}
@media (max-width:760px){
  .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0;min-width:0}
  .grip,.win-btn.maxb{display:none}
}
.pop{position:absolute;background:var(--win);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:10;min-width:210px;display:flex;flex-direction:column;gap:1px}
.pop button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px}
.pop button:hover{background:var(--win-2)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}
.pop .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
.pop .row4{display:flex;gap:4px;padding:2px 6px 4px}
.pop .row4 button{flex:1;justify-content:center;border:1px solid var(--line);padding:6px 0}
.pop .row4 button.cur{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* Barra */
#bar{display:flex;align-items:center;gap:6px;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);position:relative;z-index:5000}
#startBtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-weight:600;flex:none}
#desks{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;flex:none}
#desks button{width:26px;height:32px;border:0;border-radius:6px;background:transparent;font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;position:relative}
#desks button.cur{background:var(--accent-soft);color:var(--fg)}
#desks button.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
#tasks{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.task{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid transparent;border-radius:9px;background:transparent;max-width:190px;flex:none;font-size:13px}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task:hover{background:var(--win-2)}
.task.on{background:var(--win);border-color:var(--line);box-shadow:inset 0 -2px 0 var(--accent)}
.task.min{opacity:.6}
.task .tile.sm{width:22px;height:22px;border-radius:6px;font-size:10px;color:#fff}
#tray{display:flex;align-items:center;gap:6px;padding-left:4px;font-size:12px;color:var(--muted);flex:none}
.trayb{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:inherit;font-size:12px;padding:6px;border-radius:7px;position:relative}
.trayb:hover{background:var(--win-2)}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#sync.ok i{background:var(--ok)} #sync.warn i{background:var(--warn)} #sync.err i{background:var(--danger)}
#bell .badge{position:absolute;top:1px;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#clock{text-align:right;line-height:1.25;font-variant-numeric:tabular-nums;padding-left:4px}
#clock b{display:block;color:var(--fg);font-weight:600;font-size:13px}
@media (max-width:640px){#sync span,#startBtn span{display:none}#startBtn{padding:0 11px}.task span{display:none}.task{padding:0 9px}#clock span{display:none}#desks button{width:22px}}
@media (max-width:420px){#desks{display:none}}

.panel{position:absolute;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--win);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:6000;display:flex;flex-direction:column;max-height:calc(100% - 80px);overflow:hidden}
#start{left:max(10px,env(safe-area-inset-left,0px));width:min(360px,calc(100% - 20px))}
#notif{right:max(10px,env(safe-area-inset-right,0px));width:min(340px,calc(100% - 20px))}
.panel-scroll{overflow:auto;padding:6px 10px 10px;display:flex;flex-direction:column;gap:2px}
.who{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.who img{width:32px;height:32px;border-radius:50%}
.who b{display:block;font-size:14px}
.who small{color:var(--muted);font-size:12px}
.sbox{padding:10px 10px 4px}
.sbox input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:var(--win-2)}
.panel h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 8px 4px;font-weight:600}
.sitem{display:flex;align-items:center;gap:12px;padding:8px 10px;border:0;border-radius:9px;background:transparent;text-align:left;font-size:14px;min-width:0}
.sitem:hover,.sitem.hl{background:var(--win-2)}
.sitem div{min-width:0}
.sitem small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-foot{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.panel-foot .btn{flex:1;justify-content:center}
.nitem{padding:10px;border-radius:9px;font-size:13.5px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.nitem.new{background:var(--accent-soft)}
.nitem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* Elementi comuni delle app */
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--win);position:sticky;top:0;z-index:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--win);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--win-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dan{color:var(--danger)}
.btn svg.i{width:16px;height:16px}
.ibtn{width:32px;height:32px;border:0;border-radius:7px;background:transparent;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.ibtn:hover{background:var(--win-2);color:var(--fg)}
.ibtn svg.i{width:17px;height:17px}
.field{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--win);min-width:0}
.empty{margin:auto;padding:32px 20px;text-align:center;color:var(--muted);font-size:13.5px;max-width:38ch;line-height:1.5}
.ro{padding:8px 12px;background:var(--accent-soft);font-size:12.5px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:120px;overflow-x:auto;font-size:13px;scrollbar-width:none}
.crumbs button{border:0;background:transparent;padding:6px 8px;border-radius:6px;white-space:nowrap;color:var(--muted)}
.crumbs button:last-child{color:var(--fg);font-weight:600}
.crumbs button:hover{background:var(--win-2)}

.rows{display:flex;flex-direction:column;padding:6px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:4px 6px 4px 10px;border-radius:8px}
.row:hover{background:var(--win-2)}
.row .nm{border:0;background:transparent;text-align:left;padding:8px 0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .dt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .acts{display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.row .ic{color:var(--accent);display:grid;place-items:center}
.row .ic.doc{color:var(--muted)}
.row input{height:32px;padding:0 8px;border:1px solid var(--accent);border-radius:6px;background:var(--win);min-width:0;width:100%}
.ask{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--danger);flex-wrap:wrap}
.ext{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-left:6px}
@media (max-width:480px){.row .dt{display:none}}

.ed{display:flex;flex-direction:column;flex:1;min-height:0}
.ed-title{border:0;border-bottom:1px solid var(--line);padding:14px 18px;font-size:18px;font-weight:600;background:transparent;min-width:0}
.ed textarea{flex:1;border:0;resize:none;padding:16px 18px;background:transparent;font-size:15px;line-height:1.6;min-height:200px}
.ed textarea.code{font-family:var(--mono);font-size:13px;line-height:1.5}
.ed textarea:focus,.ed-title:focus{outline:none}
.ed-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px 6px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ed-foot select{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--win);font-size:12.5px;max-width:200px}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:12px}
.note{display:flex;flex-direction:column;border-radius:10px;color:var(--note-fg);min-height:170px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note textarea{flex:1;border:0;background:transparent;resize:none;padding:12px 12px 4px;font-size:14px;line-height:1.5;min-height:120px}
.note textarea:focus{outline:none}
.note-foot{display:flex;align-items:center;gap:6px;padding:4px 6px 6px 10px}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);padding:0}
.dot.sel{outline:2px solid var(--note-fg);outline-offset:1px}
.note .ibtn{color:inherit;opacity:.7}
.note .ibtn.on{opacity:1;background:rgba(0,0,0,.1)}
.note .sp{margin-left:auto}
.c1{background:var(--note-1)}.c2{background:var(--note-2)}.c3{background:var(--note-3)}.c4{background:var(--note-4)}

.calc{display:flex;flex-direction:column;flex:1;padding:12px;gap:10px;background:var(--win-2)}
.calc-disp{background:var(--win);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.calc-disp small{display:block;color:var(--muted);font-size:12px;min-height:16px}
.calc-disp b{display:block;font-size:30px;font-weight:500;overflow-x:auto;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1}
.keys button{border:1px solid var(--line);border-radius:10px;background:var(--win);font-family:var(--mono);font-size:19px;min-height:48px}
.keys button:hover{background:var(--accent-soft)}
.keys .op{color:var(--accent);font-weight:500}
.keys .eq{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.keys .zero{grid-column:span 2}

.ag{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);flex:1;min-height:0}
@media (max-width:620px){.ag{grid-template-columns:1fr}}
.ag-cal{padding:12px;border-right:1px solid var(--line)}
.ag-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ag-head h3{flex:1;margin:0;font-size:15px;text-transform:capitalize}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.month .wd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.day{position:relative;aspect-ratio:1/1;max-width:100%;border:0;border-radius:8px;background:transparent;font-size:13px;font-variant-numeric:tabular-nums}
.day:hover{background:var(--win-2)}
.day.out{color:var(--muted);opacity:.5}
.day.today{color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-fg)}
.day.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor;opacity:.75}
.ag-list{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ag-list h4{margin:0 0 4px;font-size:14px;text-transform:capitalize}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 6px 8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
.ev time{font-family:var(--mono);font-size:12px;color:var(--accent)}
.ev span{overflow-wrap:anywhere}
.ag-add{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px;margin-top:4px}

.set{padding:16px 18px;display:flex;flex-direction:column;gap:22px;max-width:660px}
.set h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wall-opt{border:2px solid transparent;border-radius:10px;padding:0;background:transparent;text-align:left;font-size:13px}
.wall-opt .pv{display:block;height:64px;border-radius:8px}
.wall-opt span{display:block;padding:6px 2px}
.wall-opt.sel{border-color:var(--accent)}
.set p{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted);max-width:62ch}
.set .line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}

/* Gestione app */
.am{padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.am-form{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--win-2)}
.am-form h3,.am h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.am-form .grid2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;padding:0}
.sw.sel{border-color:var(--fg)}
.filepick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.applist{display:flex;flex-direction:column;gap:8px}
.appcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.appcard b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appcard small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.appcard .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.note-box{font-size:12.5px;color:var(--muted);line-height:1.5;max-width:70ch}

/* Assistente */
.chat{display:flex;flex-direction:column;flex:1;min-height:0}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--win-2);border-bottom-left-radius:4px}
.msg.act{align-self:flex-start;font-size:12px;color:var(--muted);background:transparent;padding:0 4px}
.chat-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat-in textarea{flex:1;min-width:0;resize:none;height:44px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--win);line-height:1.4}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--line);background:var(--win);border-radius:999px;padding:6px 12px;font-size:12.5px}
.sugg button:hover{background:var(--accent-soft)}

/* Blocco schermo */
#lock{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--wall-fg);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#lock::before{content:"";position:absolute;inset:0;background:rgba(5,10,15,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:-1}
#lock .lk-time{font-family:var(--mono);font-size:64px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
#lock .lk-date{font-size:15px;text-transform:capitalize;opacity:.9;margin-top:-8px}
.pins{display:flex;gap:12px;height:16px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--wall-fg)}
.pins i.f{background:var(--wall-fg)}
.pins.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);color:var(--wall-fg);font-size:24px;font-family:var(--mono)}
.pad button:hover{background:rgba(255,255,255,.24)}
.lk-msg{min-height:18px;font-size:13px}

#toast{position:absolute;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--win);padding:10px 16px;border-radius:9px;font-size:13px;z-index:7000;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.win{animation:pop .14s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<div id="os">
  <main id="desk" class="wall-ardesia" aria-label="Scrivania">
    <div id="icons"></div>
    <aside id="widgets" aria-label="Riquadri"></aside>
    <div id="snap" hidden></div>
  </main>
  <nav id="bar" aria-label="Barra delle applicazioni">
    <button id="startBtn" aria-haspopup="menu" aria-expanded="false"></button>
    <div id="desks" role="group" aria-label="Scrivanie virtuali"></div>
    <div id="tasks"></div>
    <div id="tray">
      <button id="bell" class="trayb" title="Notifiche" aria-label="Notifiche"></button>
      <button id="sync" class="trayb" title="Stato del salvataggio"><i></i><span>Connessione…</span></button>
      <div id="clock"><b>--:--</b><span></span></div>
    </div>
  </nav>
  <div id="start" class="panel" role="menu" hidden></div>
  <div id="notif" class="panel" hidden></div>
  <div id="toast" role="status" hidden></div>
  <input type="file" id="pickFiles" class="vh" multiple tabindex="-1" aria-hidden="true">
</div>
<div id="lock" hidden></div>

<script>
/* ===================== Utilità ===================== */
const ICONS={
  folder:'<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l2 2h8.8A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>',
  doc:'<path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  note:'<path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5M8 9h8M8 12.5h5"/>',
  calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 15.5h.01M12 15.5h.01M15.5 15.5h.01M8.5 18.5h.01M12 18.5h.01M15.5 18.5h.01"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/><circle cx="12" cy="12" r="6.3"/>',
  grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  min:'<path d="M6 12h12"/>', max:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>', x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  up:'<path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/>', plus:'<path d="M12 5v14M5 12h14"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash:'<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>', left:'<path d="M15 5l-7 7 7 7"/>', right:'<path d="M9 5l7 7-7 7"/>',
  dots:'<circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/>',
  box:'<path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16z"/><path d="M3.5 8 12 12.5 20.5 8M12 12.5v8"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  lock:'<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
  upload:'<path d="M12 16V4M7 8.5 12 4l5 4.5M4.5 15v4.5h15V15"/>', down:'<path d="M12 4v12M7 11.5l5 4.5 5-4.5M4.5 19.5h15"/>',
  restore:'<path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/>', tile:'<rect x="3.5" y="4" width="7.5" height="16" rx="1.5"/><rect x="13" y="4" width="7.5" height="7" rx="1.5"/><rect x="13" y="13" width="7.5" height="7" rx="1.5"/>',
  layers:'<path d="M5 9h11v11H5z"/><path d="M8 6h11v11"/>', search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>', pin:'<path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"/>',
  reload:'<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/>', send:'<path d="M4 12 20 4l-6 16-3-7z"/>', stop:'<rect x="7" y="7" width="10" height="10" rx="1.5"/>'
};
const ic=(n)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('class','i');s.setAttribute('aria-hidden','true');s.innerHTML=ICONS[n]||ICONS.box;return s;};
function h(tag,props,...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='value')el.value=v;else if(k==='style')el.style.cssText=v;else el.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}return el;}
const $=(s)=>document.querySelector(s);
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const pad=(n)=>String(n).padStart(2,'0');
const isoDay=(d)=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const longDate=(d)=>GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]+' '+d.getFullYear();
function fmtDate(ts){if(!ts)return'';const d=new Date(ts),n=new Date();if(isoDay(d)===isoDay(n))return'oggi '+pad(d.getHours())+':'+pad(d.getMinutes());return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
const fmtSize=(n)=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1).replace('.',',')+' MB';
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4000);}
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(e){return false;}};
const lsDel=(k)=>{try{localStorage.removeItem(k);}catch(e){}};
const jGet=(k,d)=>{try{return JSON.parse(lsGet(k,'null'))??d;}catch(e){return d;}};
const jSet=(k,v)=>lsSet(k,JSON.stringify(v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const COLORS=['#1f6f8b','#2e7d4f','#a8551e','#7a4bb0','#b3261e','#5a6470','#b08900','#0f766e'];
const initials=(n)=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const extOf=(n)=>{const m=/\.([a-z0-9]{1,6})$/i.exec(n||'');return m?m[1].toLowerCase():'';};
const IN_CLAUDE=!!(window.claude&&window.claude.use);
const cap=(name)=>(window.claude&&window.claude.use)?window.claude.use(name).catch(()=>null):Promise.resolve(null);

async function saveFile(filename,data){
  const d=await cap('downloads');
  if(d){return d.save({filename,data}).then(()=>true).catch(e=>{if(e.code!=='declined')toast('Salvataggio non riuscito.');return false;});}
  try{const url=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'}));const a=h('a',{href:url,download:filename});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true;}
  catch(e){toast('Salvataggio non riuscito.');return false;}}
/* Archivio locale grande (IndexedDB) per il codice delle app */
const IDB={db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const r=indexedDB.open('sow-apps',1);r.onupgradeneeded=()=>r.result.createObjectStore('code');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('code').objectStore('code').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('code','readwrite');t.objectStore('code').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});},
  async del(k){const db=await this.open();return new Promise((res)=>{const t=db.transaction('code','readwrite');t.objectStore('code').delete(k);t.oncomplete=()=>res();t.onerror=()=>res();});}};

/* ===================== Archivio dati ===================== */
const COLS=['fs','notes','agenda','apps'];
const S={mode:'loading',synced:false,stale:false,error:null,maps:{fs:new Map(),notes:new Map(),agenda:new Map(),apps:new Map()},chains:{}};
const subs=new Set();let emitQ=false;
const emit=()=>{if(emitQ)return;emitQ=true;queueMicrotask(()=>{emitQ=false;subs.forEach(f=>{try{f();}catch(e){console.error(e);}});});};
let DB=null;
function saveLocal(){if(S.mode!=='local')return;const o={};for(const c of COLS)o[c]=Object.fromEntries(S.maps[c]);if(!lsSet('sow-v1',JSON.stringify(o)))toast('Spazio del browser esaurito: i dati non sono stati salvati.');}
function seedLocal(){const now=Date.now();
  S.maps.fs.set('ex-doc',{name:'Documenti',kind:'folder',parent:'root',updated:now});
  S.maps.fs.set('ex-ben',{name:'Benvenuto',kind:'doc',parent:'root',updated:now,content:'Esempio. Documento di prova: puoi modificarlo o eliminarlo.\n\nIn questa modalità i dati restano solo su questo dispositivo.'});
  S.maps.notes.set('ex-n1',{text:'Esempio di nota: scrivi qui, si salva da sola.',color:1,created:now,updated:now,pinned:true});}
const ready=(async()=>{
  DB=await cap('db');
  if(!DB){S.mode='local';const o=jGet('sow-v1',null);if(o)for(const c of COLS)S.maps[c]=new Map(Object.entries(o[c]||{}));
    if(!o)seedLocal();emit();return;}
  S.mode='online';let pending=COLS.length;
  const timer=setTimeout(()=>{if(!S.synced){S.stale=true;emit();}},10000);
  for(const c of COLS){let first=true;
    DB.collection(c).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data()));S.maps[c]=m;
      if(first&&!snap.metadata.fromCache){first=false;if(--pending===0){S.synced=true;S.stale=false;clearTimeout(timer);}}emit();},
      err=>{S.error=err.code;clearTimeout(timer);emit();});}
  emit();
})();
function onWriteErr(e){const c=e&&e.code;
  if(c==='invalid_argument'){S.readonly=true;toast('Non hai il permesso di modificare questi dati.');emit();}
  else if(c==='quota_exceeded')toast('Spazio esaurito: elimina qualche elemento.');
  else toast('Salvataggio non riuscito. Controlla la connessione e riprova.');
  throw e;}
function queue(c,id,fn){const k=c+'/'+id;const p=(S.chains[k]||Promise.resolve()).then(fn).catch(onWriteErr);S.chains[k]=p.catch(()=>{});return p;}
async function add(c,obj,id){await ready;obj.updated=obj.updated||Date.now();id=id||uid();
  if(S.mode==='local'){S.maps[c].set(id,obj);saveLocal();emit();return id;}
  queue(c,id,()=>DB.collection(c).doc(id).set(obj)).catch(()=>{});return id;}
async function put(c,id,obj){await ready;if(S.mode==='local'){S.maps[c].set(id,obj);saveLocal();emit();return;}return queue(c,id,()=>DB.collection(c).doc(id).set(obj));}
async function upd(c,id,patch){await ready;patch.updated=Date.now();
  if(S.mode==='local'){const o=S.maps[c].get(id);if(!o)return;S.maps[c].set(id,Object.assign({},o,patch));saveLocal();emit();return;}
  return queue(c,id,()=>DB.collection(c).doc(id).update(patch)).catch(()=>{});}
async function del(c,id){await ready;
  if(S.mode==='local'){S.maps[c].delete(id);saveLocal();emit();return;}
  return queue(c,id,()=>DB.collection(c).doc(id).delete()).catch(()=>{});}

/* ===================== Utente e permessi ===================== */
const U={name:'',avatar:'',owner:false,canWrite:null};
(async()=>{const u=await cap('user');if(!u)return;
  try{const me=await u.me();U.name=me.name;U.avatar=me.avatarUrl;U.owner=me.isOwner;U.canWrite=await u.can('data.write');}catch(e){}
  if(U.canWrite===false)S.readonly=true;renderStart();emit();})();
const roleLabel=()=>S.mode==='local'?'Su questo dispositivo':U.owner?'Proprietario':S.readonly?'Solo lettura':'Può modificare';

/* ===================== Codice delle app installate ===================== */
const CHUNK=80000;
async function writeAppCode(id,ver,text,onProg){
  if(S.mode==='local'){try{await IDB.set(id,text);}catch(e){throw new Error('local_full');}onProg&&onProg(1);return 1;}
  const n=Math.max(1,Math.ceil(text.length/CHUNK));
  for(let i=0;i<n;i++){const part=text.slice(i*CHUNK,(i+1)*CHUNK);
    await queue('appcode',id+'-v'+ver+'-'+i,()=>DB.collection('appcode').doc(id+'-v'+ver+'-'+i).set({app:id,ver,i,data:part}));
    onProg&&onProg((i+1)/n);}
  return n;}
async function readAppCode(id){const m=S.maps.apps.get(id);if(!m)throw new Error('missing');
  if(S.mode==='local'){let t=null;try{t=await IDB.get(id);}catch(e){}if(t==null)t=lsGet('sow-app-'+id,null);if(t==null)throw new Error('missing');return t;}
  const snap=await DB.collection('appcode').where('app','==',id).where('ver','==',m.ver).get();
  const parts=snap.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i);
  if(parts.length!==m.chunks)throw new Error('incomplete');return parts.map(p=>p.data).join('');}
async function dropAppCode(id,keepVer){
  if(S.mode==='local'){if(keepVer==null){lsDel('sow-app-'+id);IDB.del(id).catch(()=>{});}return;}
  try{const snap=await DB.collection('appcode').where('app','==',id).get();
    for(const d of snap.docs){if(keepVer==null||d.data().ver!==keepVer)await queue('appcode',d.id,()=>DB.collection('appcode').doc(d.id).delete());}}catch(e){}}
async function installApp({file,name,color,id},onProg){
  const text=await file.text();
  if(!/<html|<body|<script|<div|<!doctype/i.test(text.slice(0,20000)))throw new Error('not_html');
  const old=id?S.maps.apps.get(id):null;id=id||uid();const ver=old?(old.ver||1)+1:1;
  const chunks=await writeAppCode(id,ver,text,onProg);

const live=(f)=>f&&!f.trashed;

async function importFiles(files,parent){

    if(!TEXT_EXT.includes(ext)&&!(f.type||'').startsWith('text')){skipped.push(f.name);continue;}
    if(f.size>200000){skipped.push(f.name+' (oltre 200 KB)');continue;}

  if(ok)toast(ok===1?'File salvato nell’archivio.':ok+' file salvati nell’archivio.');

/* ===================== Calcolatrice ===================== */
function mountCalc(W){
  let cur='0',prev=null,op=null,fresh=true,hist='';
  const out=h('b',{}),his=h('small',{});
  const fmt=(s)=>{const n=Number(s);if(!isFinite(n))return'Errore';if(String(s).endsWith('.'))return s.replace('.',',');
    if(String(s).includes('.')&&!fresh)return String(s).replace('.',',');return n.toLocaleString('it-IT',{maximumFractionDigits:10});};
  const show=()=>{out.textContent=fmt(cur);his.textContent=hist;};
  const calc=(a,b,o)=>{a=+a;b=+b;const r=o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;return String(+r.toPrecision(12));};
  const press=(k)=>{
    if(/^\d$/.test(k)){cur=fresh||cur==='0'?k:cur+k;fresh=false;}
    else if(k===','){if(fresh){cur='0.';fresh=false;}else if(!cur.includes('.'))cur+='.';}
    else if(k==='C'){cur='0';prev=null;op=null;hist='';fresh=true;}
    else if(k==='±'){if(cur!=='0')cur=cur.startsWith('-')?cur.slice(1):'-'+cur;}
    else if(k==='%'){cur=prev!=null&&(op==='+'||op==='−')?String(+prev*+cur/100):String(+cur/100);fresh=true;}
    else if('+−×÷'.includes(k)){if(op&&!fresh)cur=calc(prev,cur,op);prev=cur;op=k;hist=fmt(prev)+' '+k;fresh=true;}
    else if(k==='='){if(op){hist=fmt(prev)+' '+op+' '+fmt(cur)+' =';cur=calc(prev,cur,op);prev=null;op=null;fresh=true;}}
    show();};
  const keys=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0',',','='];
  W.body.replaceChildren(h('div',{class:'calc'},h('div',{class:'calc-disp','aria-live':'polite'},his,out),
    h('div',{class:'keys'},keys.map(k=>h('button',{class:('+−×÷%±C'.includes(k)?'op':'')+(k==='='?' eq':'')+(k==='0'?' zero':''),onclick:()=>press(k)},k)))));
  const map={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Escape':'C','Backspace':'C','.':',',',':',','%':'%'};
  W.el.tabIndex=-1;W.el.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;const k=/^\d$/.test(e.key)?e.key:map[e.key];if(k){e.preventDefault();press(k);}});
  show();}

  return out.slice(0,30);}

  if(S.mode==='loading')s.textContent='Connessione…';
  else if(S.mode==='local'){b.classList.add('warn');s.textContent='Solo su questo dispositivo';}
  else if(S.error){b.classList.add('err');s.textContent='Archivio non raggiungibile';}
  else if(S.stale){b.classList.add('warn');s.textContent='In attesa della rete';}
  else if(S.synced){b.classList.add('ok');s.textContent=S.readonly?'Sola lettura':'Sincronizzato';}
  else s.textContent='Sincronizzazione…';}
$('#sync').addEventListener('click',()=>openApp('settings'));
let lastMin=-1;
function tick(){const d=new Date();$('#clock b').textContent=pad(d.getHours())+':'+pad(d.getMinutes());$('#clock span').textContent=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
  if(d.getMinutes()!==lastMin){lastMin=d.getMinutes();renderWidgets();if(!lockEl.hidden&&!entered)renderLock();if(S.mode!=='loading')checkReminders();}
  const al=+lsGet('sow-autolock','0');if(al&&lsGet('sow-pin','')&&lockEl.hidden&&Date.now()-lastAct>al*60000)lockNow();}
setInterval(tick,5000);
window.addEventListener('resize',()=>{if(narrow.matches)return;wins.forEach(W=>{if(!W.el.classList.contains('max'))setRect(W.el,W.el.offsetLeft,W.el.offsetTop,W.el.offsetWidth,W.el.offsetHeight);});});

setWall(lsGet('sow-wall','ardesia'));renderDesks();renderBell();renderSync();renderIcons();tick();
if(lsGet('sow-pin',''))lockNow();
if(!narrow.matches)openApp('files');
ready.then(()=>setTimeout(checkReminders,1500));
if(!IN_CLAUDE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
