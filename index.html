<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sistema OS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Sistema Operativo Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: scrivania a tutto schermo + barra in basso; finestre libere su PC (aggancio ai bordi), a schermo intero su schermi stretti */
:root{
  --win:#f7f8f9; --win-2:#eceff2; --fg:#1b2127; --muted:#5f6b76; --line:#d5dbe1;
  --accent:#1f6f8b; --accent-fg:#ffffff; --accent-soft:#dbeaf0; --danger:#b3261e; --ok:#2e7d4f; --warn:#a86a00;
  --bar:rgba(246,248,250,.88); --shadow:0 18px 50px rgba(10,20,30,.28),0 2px 6px rgba(10,20,30,.18);
  --wall-fg:#ffffff; --glass:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.22);
  --note-1:#fff4c2; --note-2:#dff1e3; --note-3:#dcebf7; --note-4:#f7e1e6; --note-fg:#2a2a22;
  --ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --win:#1d2328; --win-2:#262d33; --fg:#e7ebee; --muted:#9aa6b0; --line:#36404a;
  --accent:#5fb3cf; --accent-fg:#0d1a20; --accent-soft:#1f3a45; --danger:#f2867e; --ok:#72c79a; --warn:#e3b04f;
  --bar:rgba(22,27,31,.88); --shadow:0 18px 50px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  --note-1:#4a4428; --note-2:#2c4232; --note-3:#2a3c4c; --note-4:#4a2f36; --note-fg:#f1eee2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --win:#1d2328; --win-2:#262d33; --fg:#e7ebee; --muted:#9aa6b0; --line:#36404a;
  --accent:#5fb3cf; --accent-fg:#0d1a20; --accent-soft:#1f3a45; --danger:#f2867e; --ok:#72c79a; --warn:#e3b04f;
  --bar:rgba(22,27,31,.88); --shadow:0 18px 50px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  --note-1:#4a4428; --note-2:#2c4232; --note-3:#2a3c4c; --note-4:#4a2f36; --note-fg:#f1eee2;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--win-2);color:var(--fg);font-family:var(--ui);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

#os{height:100%;display:grid;grid-template-rows:1fr auto;position:relative}
#desk{position:relative;overflow:hidden;min-height:0;z-index:0;isolation:isolate}
.wall-ardesia{background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 10px),radial-gradient(120% 90% at 85% 5%,#56616c 0%,#2f363e 55%,#1d2227 100%)}
.wall-mare{background:radial-gradient(60% 30% at 70% 38%,rgba(255,240,210,.35),transparent 70%),linear-gradient(180deg,#a9cbd6 0%,#6aa2b6 36%,#2b6c86 37%,#174a63 70%,#0e3247 100%)}
.wall-ulivo{background:radial-gradient(70% 60% at 20% 85%,#7c8a59 0%,#4c5737 55%,#30381f 100%)}
#desk.drop::after{content:"Rilascia qui i file per salvarli nell’archivio";position:absolute;inset:12px;border:2px dashed var(--wall-fg);border-radius:14px;display:grid;place-items:center;color:var(--wall-fg);font-weight:600;background:rgba(0,0,0,.35);z-index:4000;pointer-events:none}

#icons{position:absolute;inset:0}
.dicon{position:absolute;width:88px;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:0;border-radius:10px;background:transparent;color:var(--wall-fg);text-align:center;font-size:12.5px;font-weight:500;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.7);overflow:hidden}
.dicon:hover{background:rgba(255,255,255,.12)}
.dicon.drag{background:rgba(255,255,255,.2);z-index:2;cursor:grabbing}
.tile{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.93);color:#1f4f63;box-shadow:0 4px 12px rgba(0,0,0,.3);flex:none;font-weight:700;font-size:17px;text-shadow:none;letter-spacing:.02em}
.tile svg.i{width:26px;height:26px}
.tile.sm{width:30px;height:30px;border-radius:8px;font-size:12px;box-shadow:none}
.tile.sm svg.i{width:18px;height:18px}
.dicon .lbl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}

/* Widget */
#widgets{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px));width:268px;display:none;flex-direction:column;gap:12px;color:var(--wall-fg)}
@media (min-width:980px){#widgets{display:flex}}
.wg{background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.wg h3{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.85}
.wg-clock b{display:block;font-family:var(--mono);font-size:40px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.wg-clock span{display:block;margin-top:6px;font-size:13px;text-transform:capitalize;opacity:.9}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.wg li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.wg li time{font-family:var(--mono);font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.wg li span{overflow-wrap:anywhere}
.wg .pin{font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.12)}
.wg .none{font-size:13px;opacity:.75}

/* Finestre */
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:280px;min-height:200px}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win-head{display:flex;align-items:center;gap:10px;height:42px;padding:0 6px 0 12px;background:var(--win-2);border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:none;flex:none;position:relative}
.win.active .win-head{background:var(--accent-soft)}
.win-title{flex:1;min-width:0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-btn{width:34px;height:30px;border:0;border-radius:7px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.win-btn:hover{background:var(--line);color:var(--fg)}
.win-btn.close:hover{background:var(--danger);color:#fff}
.win-btn svg.i{width:16px;height:16px}
.win-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;position:relative}
.win-body iframe{flex:1;width:100%;border:0;background:#fff;display:block}
.win.moving iframe{pointer-events:none}
.grip{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,var(--line) 55% 62%,transparent 62% 72%,var(--line) 72% 79%,transparent 79%)}
.win.max .grip{display:none}
#snap{position:absolute;border-radius:12px;background:rgba(95,179,207,.22);border:2px solid rgba(95,179,207,.85);pointer-events:none;z-index:2147483000;transition:all .08s}
@media (max-width:760px){.win{min-width:240px}.win-head{height:46px}.win-btn{width:38px;height:34px}.grip{width:26px;height:26px}}
.win.ontop .win-head::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.help{padding:16px 18px;display:flex;flex-direction:column;gap:18px;max-width:640px}
.help h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.help .ver{display:flex;align-items:baseline;gap:10px}
.help .ver b{font-family:var(--mono);font-size:30px;font-weight:500}
.rel{border-left:2px solid var(--line);padding:2px 0 2px 14px;margin-bottom:12px}
.rel.cur{border-color:var(--accent)}
.rel header{display:flex;gap:10px;align-items:baseline;font-weight:600}
.rel header span{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.rel ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.55}
.help p,.help li{font-size:13.5px;line-height:1.55}
.help p{margin:0;color:var(--muted);max-width:62ch}
.shield{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--win-2)}
.shield svg.i{color:var(--ok);width:22px;height:22px}
.vw{display:flex;flex-direction:column;flex:1;min-height:0}
.vw-body{flex:1;min-height:0;overflow:auto;background:var(--win-2);display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
.vw-body canvas{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);flex:none}
.vw-body img{max-width:100%;height:auto;background:#fff;flex:none}
.vw-body img.full{max-width:none}
.vw-body video{max-width:100%;max-height:100%;background:#000}
.vw-body pre{margin:0;align-self:stretch;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:12.5px;line-height:1.5;background:var(--win);padding:14px;border-radius:8px}
.vw-body iframe.docx{align-self:stretch;flex:1;min-height:420px;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.vw-body.tblmode{padding:0;align-items:stretch}
.tbl-wrap{overflow:auto;flex:1;min-height:0;background:var(--win)}
.tbl{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tbl th{position:sticky;top:0;background:var(--win-2);font-weight:600;color:var(--muted);z-index:1}
.tbl td.rn{position:sticky;left:0;background:var(--win-2);color:var(--muted);text-align:right}
.tabs-s{display:flex;gap:4px;padding:6px 10px;border-top:1px solid var(--line);overflow-x:auto;flex:none;background:var(--win)}
.tabs-s button{border:1px solid var(--line);background:var(--win);border-radius:6px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.tabs-s button.cur{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.finfo{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted);font-size:13.5px;max-width:42ch}
.finfo .big{width:64px;height:64px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-family:var(--mono);font-weight:600;text-transform:uppercase}
.finfo b{color:var(--fg);font-size:15px;overflow-wrap:anywhere}
.br{display:flex;flex-direction:column;flex:1;min-height:0}
.br-tabs{display:flex;gap:2px;padding:6px 6px 0;background:var(--win-2);overflow-x:auto;flex:none;scrollbar-width:none}
.br-tab{display:flex;align-items:center;gap:4px;max-width:200px;flex:none;padding:0 2px 0 10px;height:32px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--win-2);font-size:12.5px}
.br-tab.cur{background:var(--win)}
.br-tab .t{border:0;background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;padding:0;font-size:12.5px}
.br-tab .ibtn{width:24px;height:24px}
.br-bar{display:flex;gap:2px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex:none;background:var(--win)}
.br-bar form{flex:1;min-width:0;display:flex}
.br-bar input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:var(--win-2)}
.br-bar .ibtn.on{color:var(--warn)}
.br-bar a.ibtn{text-decoration:none}
.br-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;font-size:12px;color:var(--muted);background:var(--win-2);border-bottom:1px solid var(--line);flex:none}
.br-note a{color:var(--accent);font-weight:600}
.br-view{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--win)}
.br-view iframe{flex:1;border:0;width:100%;background:#fff}
.br-page{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.br-page h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.br-card{margin:auto;max-width:46ch;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;font-size:13.5px;color:var(--muted);line-height:1.5}
.br-card b{color:var(--fg);font-size:15px;overflow-wrap:anywhere}
.bm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.bm{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--win);min-width:0;overflow:hidden}
.bm .go{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 8px;border:0;background:transparent;color:inherit;text-decoration:none;font-size:12.5px;min-width:0}
.bm .go:hover{background:var(--win-2)}
.bm .go b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bm .go small{color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .bm-act{display:flex;justify-content:center;gap:2px;border-top:1px solid var(--line)}
.bm .bm-act .ibtn.on{color:var(--accent)}
.hist{display:flex;flex-direction:column;gap:2px}
.hist .go{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:transparent;border-radius:8px;text-align:left;font-size:13px;color:inherit;text-decoration:none;min-width:0}
.hist .go:hover{background:var(--win-2)}
.hist .go span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hist .go small{color:var(--muted);margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
a.linkbtn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 18px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-weight:600;text-decoration:none;font-size:14px}
.pop{position:absolute;background:var(--win);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:10;min-width:210px;display:flex;flex-direction:column;gap:1px}
.pop button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px}
.pop button:hover{background:var(--win-2)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}
.pop .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
.pop .row4{display:flex;gap:4px;padding:2px 6px 4px}
.pop .row4 button{flex:1;justify-content:center;border:1px solid var(--line);padding:6px 0}
.pop .row4 button.cur{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* Barra */
#bar{display:flex;align-items:center;gap:6px;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);position:relative;z-index:5000}
#startBtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-weight:600;flex:none}
#desks{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;flex:none}
#desks button{width:26px;height:32px;border:0;border-radius:6px;background:transparent;font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;position:relative}
#desks button.cur{background:var(--accent-soft);color:var(--fg)}
#desks button.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
#tasks{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.task{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid transparent;border-radius:9px;background:transparent;max-width:190px;flex:none;font-size:13px}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task:hover{background:var(--win-2)}
.task.on{background:var(--win);border-color:var(--line);box-shadow:inset 0 -2px 0 var(--accent)}
.task.min{opacity:.6}
.task .tile.sm{width:22px;height:22px;border-radius:6px;font-size:10px;color:#fff}
#tray{display:flex;align-items:center;gap:6px;padding-left:4px;font-size:12px;color:var(--muted);flex:none}
.trayb{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:inherit;font-size:12px;padding:6px;border-radius:7px;position:relative}
.trayb:hover{background:var(--win-2)}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#sync.ok i{background:var(--ok)} #sync.warn i{background:var(--warn)} #sync.err i{background:var(--danger)}
#bell .badge{position:absolute;top:1px;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#clock{text-align:right;line-height:1.25;font-variant-numeric:tabular-nums;padding-left:4px}
#clock b{display:block;color:var(--fg);font-weight:600;font-size:13px}
@media (max-width:640px){#sync span,#startBtn span{display:none}#startBtn{padding:0 11px}.task span{display:none}.task{padding:0 9px}#clock span{display:none}#desks button{width:22px}}
@media (max-width:420px){#desks{display:none}}

.panel{position:absolute;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--win);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:6000;display:flex;flex-direction:column;max-height:calc(100% - 80px);overflow:hidden}
#start{left:max(10px,env(safe-area-inset-left,0px));width:min(360px,calc(100% - 20px))}
#notif{right:max(10px,env(safe-area-inset-right,0px));width:min(340px,calc(100% - 20px))}
.panel-scroll{overflow:auto;padding:6px 10px 10px;display:flex;flex-direction:column;gap:2px}
.who{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.who img{width:32px;height:32px;border-radius:50%}
.who b{display:block;font-size:14px}
.who small{color:var(--muted);font-size:12px}
.sbox{padding:10px 10px 4px}
.sbox input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:var(--win-2)}
.panel h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 8px 4px;font-weight:600}
.sitem{display:flex;align-items:center;gap:12px;padding:8px 10px;border:0;border-radius:9px;background:transparent;text-align:left;font-size:14px;min-width:0}
.sitem:hover,.sitem.hl{background:var(--win-2)}
.sitem div{min-width:0}
.sitem small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-foot{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.panel-foot .btn{flex:1;justify-content:center}
.nitem{padding:10px;border-radius:9px;font-size:13.5px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.nitem.new{background:var(--accent-soft)}
.nitem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* Elementi comuni delle app */
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--win);position:sticky;top:0;z-index:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--win);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--win-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dan{color:var(--danger)}
.btn svg.i{width:16px;height:16px}
.ibtn{width:32px;height:32px;border:0;border-radius:7px;background:transparent;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.ibtn:hover{background:var(--win-2);color:var(--fg)}
.ibtn svg.i{width:17px;height:17px}
.field{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--win);min-width:0}
.empty{margin:auto;padding:32px 20px;text-align:center;color:var(--muted);font-size:13.5px;max-width:38ch;line-height:1.5}
.ro{padding:8px 12px;background:var(--accent-soft);font-size:12.5px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:120px;overflow-x:auto;font-size:13px;scrollbar-width:none}
.crumbs button{border:0;background:transparent;padding:6px 8px;border-radius:6px;white-space:nowrap;color:var(--muted)}
.crumbs button:last-child{color:var(--fg);font-weight:600}
.crumbs button:hover{background:var(--win-2)}

.rows{display:flex;flex-direction:column;padding:6px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:4px 6px 4px 10px;border-radius:8px}
.row:hover{background:var(--win-2)}
.row .nm{border:0;background:transparent;text-align:left;padding:8px 0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .dt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .acts{display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.row .ic{color:var(--accent);display:grid;place-items:center}
.row .ic.doc{color:var(--muted)}
.row input{height:32px;padding:0 8px;border:1px solid var(--accent);border-radius:6px;background:var(--win);min-width:0;width:100%}
.ask{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--danger);flex-wrap:wrap}
.ext{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-left:6px}

.ed{display:flex;flex-direction:column;flex:1;min-height:0}
.ed-title{border:0;border-bottom:1px solid var(--line);padding:14px 18px;font-size:18px;font-weight:600;background:transparent;min-width:0}
.ed textarea{flex:1;border:0;resize:none;padding:16px 18px;background:transparent;font-size:15px;line-height:1.6;min-height:200px}

.ed textarea:focus,.ed-title:focus{outline:none}
.ed-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px 6px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ed-foot select{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--win);font-size:12.5px;max-width:200px}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:12px}
.note{display:flex;flex-direction:column;border-radius:10px;color:var(--note-fg);min-height:170px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note textarea{flex:1;border:0;background:transparent;resize:none;padding:12px 12px 4px;font-size:14px;line-height:1.5;min-height:120px}
.note textarea:focus{outline:none}
.note-foot{display:flex;align-items:center;gap:6px;padding:4px 6px 6px 10px}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);padding:0}
.dot.sel{outline:2px solid var(--note-fg);outline-offset:1px}
.note .ibtn{color:inherit;opacity:.7}
.note .ibtn.on{opacity:1;background:rgba(0,0,0,.1)}
.note .sp{margin-left:auto}
.c1{background:var(--note-1)}.c2{background:var(--note-2)}.c3{background:var(--note-3)}.c4{background:var(--note-4)}

.calc{display:flex;flex-direction:column;flex:1;padding:12px;gap:10px;background:var(--win-2)}
.calc-disp{background:var(--win);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.calc-disp small{display:block;color:var(--muted);font-size:12px;min-height:16px}
.calc-disp b{display:block;font-size:30px;font-weight:500;overflow-x:auto;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1}
.keys button{border:1px solid var(--line);border-radius:10px;background:var(--win);font-family:var(--mono);font-size:19px;min-height:48px}
.keys button:hover{background:var(--accent-soft)}
.keys .op{color:var(--accent);font-weight:500}
.keys .eq{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.keys .zero{grid-column:span 2}

.ag{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);flex:1;min-height:0}

.ag-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ag-head h3{flex:1;margin:0;font-size:15px;text-transform:capitalize}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}

.day{position:relative;aspect-ratio:1/1;max-width:100%;border:0;border-radius:8px;background:transparent;font-size:13px;font-variant-numeric:tabular-nums}

.day.out{color:var(--muted);opacity:.5}
.day.today{color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-fg)}
.day.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor;opacity:.75}
.ag-list{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ag-list h4{margin:0 0 4px;font-size:14px;text-transform:capitalize}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 6px 8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
.ev time{font-family:var(--mono);font-size:12px;color:var(--accent)}
.ev span{overflow-wrap:anywhere}
.ag-add{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px;margin-top:4px}

.set{padding:16px 18px;display:flex;flex-direction:column;gap:22px;max-width:660px}
.set h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wall-opt{border:2px solid transparent;border-radius:10px;padding:0;background:transparent;text-align:left;font-size:13px}
.wall-opt .pv{display:block;height:64px;border-radius:8px}
.wall-opt span{display:block;padding:6px 2px}
.wall-opt.sel{border-color:var(--accent)}
.set p{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted);max-width:62ch}
.set .line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}

.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;padding:0}

.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}

.chat-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat-in textarea{flex:1;min-width:0;resize:none;height:44px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--win);line-height:1.4}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--line);background:var(--win);border-radius:999px;padding:6px 12px;font-size:12.5px}
.sugg button:hover{background:var(--accent-soft)}

/* Blocco schermo */
#lock{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--wall-fg);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#lock::before{content:"";position:absolute;inset:0;background:rgba(5,10,15,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:-1}
#lock .lk-time{font-family:var(--mono);font-size:64px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
#lock .lk-date{font-size:15px;text-transform:capitalize;opacity:.9;margin-top:-8px}
.pins{display:flex;gap:12px;height:16px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--wall-fg)}
.pins i.f{background:var(--wall-fg)}
.pins.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);color:var(--wall-fg);font-size:24px;font-family:var(--mono)}
.pad button:hover{background:rgba(255,255,255,.24)}
.lk-msg{min-height:18px;font-size:13px}

#toast{position:absolute;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--win);padding:10px 16px;border-radius:9px;font-size:13px;z-index:7000;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.win{animation:pop .14s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

const ready=(async()=>{
  DB=await cap('db');
  if(!DB){S.mode='local';const o=jGet('sow-v1',null);if(o)for(const c of COLS)S.maps[c]=new Map(Object.entries(o[c]||{}));
    if(!o)seedLocal();emit();return;}
  S.mode='online';let pending=COLS.length;
  const timer=setTimeout(()=>{if(!S.synced){S.stale=true;emit();}},10000);
  for(const c of COLS){let first=true;
    DB.collection(c).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data()));S.maps[c]=m;
      if(first&&!snap.metadata.fromCache){first=false;if(--pending===0){S.synced=true;S.stale=false;clearTimeout(timer);}}emit();},
      err=>{S.error=err.code;clearTimeout(timer);emit();});}
  emit();
})();
function onWriteErr(e){const c=e&&e.code;
  if(c==='invalid_argument'){S.readonly=true;toast('Non hai il permesso di modificare questi dati.');emit();}
  else if(c==='quota_exceeded')toast('Spazio esaurito: elimina qualche elemento.');
  else toast('Salvataggio non riuscito. Controlla la connessione e riprova.');
  throw e;}
function queue(c,id,fn){const k=c+'/'+id;const p=(S.chains[k]||Promise.resolve()).then(fn).catch(onWriteErr);S.chains[k]=p.catch(()=>{});return p;}
async function add(c,obj,id){await ready;obj.updated=obj.updated||Date.now();id=id||uid();

  queue(c,id,()=>DB.collection(c).doc(id).set(obj)).catch(()=>{});return id;}

const CHUNK=80000;
async function writeAppCode(id,ver,text,onProg){
  if(S.mode==='local'){try{await IDB.set(id,text);}catch(e){throw new Error('local_full');}onProg&&onProg(1);return 1;}
  const n=Math.max(1,Math.ceil(text.length/CHUNK));
  for(let i=0;i<n;i++){const part=text.slice(i*CHUNK,(i+1)*CHUNK);
    await queue('appcode',id+'-v'+ver+'-'+i,()=>DB.collection('appcode').doc(id+'-v'+ver+'-'+i).set({app:id,ver,i,data:part}));
    onProg&&onProg((i+1)/n);}
  return n;}
async function readAppCode(id){const m=S.maps.apps.get(id);if(!m)throw new Error('missing');
  if(S.mode==='local'){let t=null;try{t=await IDB.get(id);}catch(e){}if(t==null)t=lsGet('sow-app-'+id,null);if(t==null)throw new Error('missing');return t;}
  const snap=await DB.collection('appcode').where('app','==',id).where('ver','==',m.ver).get();
  const parts=snap.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i);
  if(parts.length!==m.chunks)throw new Error('incomplete');return parts.map(p=>p.data).join('');}
async function dropAppCode(id,keepVer){
  if(S.mode==='local'){if(keepVer==null){lsDel('sow-app-'+id);IDB.del(id).catch(()=>{});}return;}
  try{const snap=await DB.collection('appcode').where('app','==',id).get();
    for(const d of snap.docs){if(keepVer==null||d.data().ver!==keepVer)await queue('appcode',d.id,()=>DB.collection('appcode').doc(d.id).delete());}}catch(e){}}
async function installApp({file,name,color,id},onProg){
  const text=/\.zip$/i.test(file.name)?await bundleZip(file):await file.text();
  if(!/<html|<body|<script|<div|<!doctype/i.test(text.slice(0,20000)))throw new Error('not_html');
  if(text.length>15*MB)throw new Error('too_large_app');
  const old=id?S.maps.apps.get(id):null;id=id||uid();const ver=old?(old.ver||1)+1:1;
  const chunks=await writeAppCode(id,ver,text,onProg);
  const meta={name,color,ver,chunks,size:text.length,file:file.name,installed:old?old.installed:Date.now(),updated:Date.now()};
  await put('apps',id,meta);
  if(old)dropAppCode(id,ver);
  wins.filter(w=>w.app==='run'&&w.state.id===id).forEach(w=>w.reload&&w.reload());
  return id;}
async function uninstallApp(id){wins.filter(w=>w.app==='run'&&w.state.id===id).forEach(closeWin);await del('apps',id);dropAppCode(id,null);APPDATA.drop(id);}

  init(){if(!this.ready)this.ready=(async()=>{await ready;if(S.mode==='online')this.assets=await cap('assets');})();return this.ready;},
  limit(){return S.mode==='online'?20*MB:300*MB;},

/* ===================== Calcolatrice ===================== */
function mountCalc(W){
  let cur='0',prev=null,op=null,fresh=true,hist='';
  const out=h('b',{}),his=h('small',{});
  const fmt=(s)=>{const n=Number(s);if(!isFinite(n))return'Errore';if(String(s).endsWith('.'))return s.replace('.',',');
    if(String(s).includes('.')&&!fresh)return String(s).replace('.',',');return n.toLocaleString('it-IT',{maximumFractionDigits:10});};
  const show=()=>{out.textContent=fmt(cur);his.textContent=hist;};
  const calc=(a,b,o)=>{a=+a;b=+b;const r=o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;return String(+r.toPrecision(12));};
  const press=(k)=>{
    if(/^\d$/.test(k)){cur=fresh||cur==='0'?k:cur+k;fresh=false;}
    else if(k===','){if(fresh){cur='0.';fresh=false;}else if(!cur.includes('.'))cur+='.';}
    else if(k==='C'){cur='0';prev=null;op=null;hist='';fresh=true;}
    else if(k==='±'){if(cur!=='0')cur=cur.startsWith('-')?cur.slice(1):'-'+cur;}
    else if(k==='%'){cur=prev!=null&&(op==='+'||op==='−')?String(+prev*+cur/100):String(+cur/100);fresh=true;}
    else if('+−×÷'.includes(k)){if(op&&!fresh)cur=calc(prev,cur,op);prev=cur;op=k;hist=fmt(prev)+' '+k;fresh=true;}
    else if(k==='='){if(op){hist=fmt(prev)+' '+op+' '+fmt(cur)+' =';cur=calc(prev,cur,op);prev=null;op=null;fresh=true;}}
    show();};
  const keys=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0',',','='];
  W.body.replaceChildren(h('div',{class:'calc'},h('div',{class:'calc-disp','aria-live':'polite'},his,out),
    h('div',{class:'keys'},keys.map(k=>h('button',{class:('+−×÷%±C'.includes(k)?'op':'')+(k==='='?' eq':'')+(k==='0'?' zero':''),onclick:()=>press(k)},k)))));
  const map={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Escape':'C','Backspace':'C','.':',',',':',','%':'%'};
  W.el.tabIndex=-1;W.el.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;const k=/^\d$/.test(e.key)?e.key:map[e.key];if(k){e.preventDefault();press(k);}});
  show();}

function searchAll(q){q=q.trim().toLowerCase();if(!q)return[];const out=[];const has=(s)=>String(s||'').toLowerCase().includes(q);

function mountAssistant(W){
  const turns=[];let ctl=null;

  const ta=h('textarea',{placeholder:'Scrivi cosa ti serve…','aria-label':'Messaggio per l’assistente',rows:'1'});
  const sendB=h('button',{class:'btn pri','aria-label':'Invia'},ic('send'));
  const sugg=h('div',{class:'sugg'},['Che impegni ho questa settimana?','Crea una nota: chiamare il fornitore domani','Affianca le finestre aperte','Quali app ho installato?'].map(s=>h('button',{onclick:()=>{ta.value=s;send();}},s)));
  msgs.append(h('div',{class:'msg a'},'Ciao. Posso aprire app, creare note e documenti, gestire l’agenda e cercare nei tuoi file. Scrivi in italiano normale.'),sugg);
  const rules=()=>{const d=new Date();return'Sei l’assistente del “Sistema Operativo Web” di Silvio. Rispondi in italiano, in modo breve e diretto, senza preamboli né saluti di cortesia. Oggi è '+longDate(d)+' ('+isoDay(d)+'), ore '+pad(d.getHours())+':'+pad(d.getMinutes())+'. Usa gli strumenti per agire sul sistema invece di spiegare come fare. Per date relative (domani, lunedì) calcola la data esatta. Se una richiesta è ambigua chiedi una sola precisazione. App installate: '+([...S.maps.apps.values()].map(m=>m.name).join(', ')||'nessuna')+'.';};
  async function send(){const t=ta.value.trim();if(!t)return;if(ctl){ctl.abort();return;}
    sugg.remove();ta.value='';msgs.append(h('div',{class:'msg u'},t));turns.push({role:'user',content:t});
    const bubble=h('div',{class:'msg a'},'Sto pensando…');msgs.append(bubble);msgs.scrollTop=msgs.scrollHeight;
    const sample=await cap('sample');if(!sample){bubble.textContent='L’assistente non è disponibile in questa vista. Apri la scrivania da claude.ai con il tuo account.';turns.pop();return;}
    ctl=new AbortController();sendB.replaceChildren(ic('stop'));sendB.setAttribute('aria-label','Ferma');
    const tools=TOOLS.map(T=>({...T,execute:async(inp,cx)=>{const r=await T.execute(inp||{},cx);const n=h('div',{class:'msg act'},'✓ '+T.name.replace(/_/g,' '));bubble.before(n);msgs.scrollTop=msgs.scrollHeight;return r;}}));
    try{const {text}=await sample([{role:'user',content:rules()},...turns.slice(-16)],{signal:ctl.signal,tools,onText:({text})=>{bubble.textContent=text;msgs.scrollTop=msgs.scrollHeight;}});
      turns.push({role:'assistant',content:text});}
    catch(e){const keep=e.text||'';
      const msg={cancelled:'',not_granted:'Accesso all’assistente non consentito.',sampling_disabled:'Assistente non disponibile per questo account.',rate_limited:'Troppe richieste ravvicinate: riprova tra poco.',session_expired:'Sessione scaduta: accedi di nuovo a claude.ai.',tools_unavailable:'In questa vista l’assistente non può agire sul sistema.',refused:'Non posso rispondere a questa richiesta.'}[e.code];
      bubble.textContent=keep+(keep&&msg?'\n\n':'')+(msg??'Risposta interrotta. Riprova.');if(keep)turns.push({role:'assistant',content:keep});else if(!keep&&e.code!=='cancelled')turns.pop();}
    finally{ctl=null;sendB.replaceChildren(ic('send'));sendB.setAttribute('aria-label','Invia');msgs.scrollTop=msgs.scrollHeight;}}
  sendB.addEventListener('click',()=>{if(ctl)ctl.abort();else send();});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  W.body.replaceChildren(h('div',{class:'chat'},msgs,h('div',{class:'chat-in'},ta,sendB)));
  requestAnimationFrame(()=>ta.focus());}

const codeCache={};
async function buildBackup(withApps,fileBudget){
  await ready;const o={formato:'sistema-operativo-web',versione:1,versioneSistema:VERSIONE_SISTEMA,creato:new Date().toISOString(),dati:{}};
  for(const c of COLS)o.dati[c]=Object.fromEntries(S.maps[c]);
  o.datiApp={};for(const id of S.maps.apps.keys()){APPDATA.flush(id);o.datiApp[id]=await APPDATA.load(id);}
  if(withApps){o.codice={};for(const[id,m]of S.maps.apps){const k=id+':'+m.ver;if(codeCache[k]==null){try{codeCache[k]=await readAppCode(id);}catch(e){continue;}}o.codice[id]=codeCache[k];}}
  o.file={};o.fileEsclusi=[];
  if(fileBudget){let used=0;for(const[id,f]of fsFiles().sort((a,b)=>(a[1].size||0)-(b[1].size||0))){
    if(used+(f.size||0)>fileBudget){o.fileEsclusi.push(fullName(f));continue;}
    try{o.file[id]={b64:await blobToB64(await FILES.blob(f.blob,f.mime)),mime:f.mime||''};used+=f.size||0;}catch(e){o.fileEsclusi.push(fullName(f));}}}
  return o;}
const fsFiles=()=>[...S.maps.fs.entries()].filter(([,f])=>f.kind==='file'&&!f.trashed&&f.blob);

  if(await saveFile('backup-sistema-'+stamp()+'.json',JSON.stringify(o)))toast(o.fileEsclusi.length?'Backup salvato. Esclusi per dimensione: '+o.fileEsclusi.join(', '):'Backup salvato.');}

async function importBackupText(text,fromDrive){
  let o;try{o=JSON.parse(text);}catch(e){toast('Il file non è un backup valido.');return false;}
  if(!o||o.formato!=='sistema-operativo-web'||!o.dati){toast('Il file non è un backup di questo sistema.');return false;}
  let n=0;for(const c of COLS){for(const[id,v]of Object.entries(o.dati[c]||{})){
    if(c==='apps'){const code=o.codice&&o.codice[id];if(!code)continue;const ver=(v.ver||1);try{v.chunks=await writeAppCode(id,ver,code);}catch(e){continue;}}
    await put(c,id,v).catch(()=>{});n++;}}
  for(const[id,d]of Object.entries(o.datiApp||{})){if(d&&typeof d==='object'){try{await APPDATA.replace(id,d);n++;}catch(e){}}}
  let nf=0,mf=0;
  for(const[id,x]of Object.entries(o.file||{})){try{const ref=await FILES.store(b64ToBlob(x.b64,x.mime));await upd('fs',id,{blob:ref});nf++;}catch(e){mf++;}}
  if(fromDrive)for(const[id,did]of Object.entries(o.fileDrive||{})){if(o.file&&o.file[id])continue;const cur=S.maps.fs.get(id);if(cur&&await FILES.has(cur.blob))continue;
    try{const b=await DRIVE.downloadBlob(did,cur&&cur.mime);const ref=await FILES.store(b);await upd('fs',id,{blob:ref});nf++;}catch(e){mf++;}}
  toast('Ripristinati '+n+' elementi'+(nf?' e '+nf+' file':'')+' dal backup.'+(mf?' '+mf+' file non recuperati.':''));return true;}

const GD={cfg:jGet('sow-drive',{}),busy:false,timer:null,lastHash:lsGet('sow-drive-hash',''),status:''};

function strHash(s){let x=0x811c9dc5;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return(x>>>0).toString(16)+':'+s.length;}

const qEsc=(s)=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
function b64ToText(b){const bin=atob(String(b).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
function decodeDownload(p){
  if(typeof p==='string'){const t=p.trim();if(t.startsWith('{'))return t;try{return b64ToText(t);}catch(e){return t;}}
  if(p&&typeof p==='object'){for(const k of['content','data','base64Content','contents','body','text']){if(typeof p[k]==='string')return decodeDownload(p[k]);}
    let best='';for(const v of Object.values(p))if(typeof v==='string'&&v.length>best.length)best=v;if(best)return decodeDownload(best);}
  throw{code:'bad_download'};}
/* Versione claude.ai: usa il Google Drive già collegato all'account */
const DRIVE_MCP={
  async m(){const m=await cap('mcp');if(!m)throw{code:'no_mcp'};return m;},
  async call(tool,input){const m=await this.m();const r=await m.callTool('Google Drive',tool,input,{cache:false});return r.payload;},
  async folders(parent){const p=await this.call('search_files',{query:"mimeType = 'application/vnd.google-apps.folder' and parentId = '"+qEsc(parent)+"' and trashed = false",pageSize:100,excludeContentSnippets:true});
    return((p&&p.files)||[]).map(f=>({id:f.id,name:f.title||f.name})).sort((a,b)=>String(a.name).localeCompare(String(b.name),'it'));},
  async upload(name,json,folder){const m=await this.m();let fa=false;try{fa=!!(await m.listTools()).fileArgs;}catch(e){}
    const input={title:name,parentId:folder,contentMimeType:'application/json',disableConversionToGoogleType:true};
    if(fa)input.base64Content={$file:{data:new Blob([json],{type:'application/json'}),name:'backup.json',type:'application/json'}};
    else{if(new Blob([json]).size>900000)throw{code:'too_large'};input.textContent=json;}
    await m.callTool('Google Drive','create_file',input,{cache:false});},
  async uploadBlob(name,blob,mime,folder){const m=await this.m();let fa=false;try{fa=!!(await m.listTools()).fileArgs;}catch(e){}
    const input={title:name,parentId:folder,contentMimeType:mime||'application/octet-stream',disableConversionToGoogleType:true};
    if(fa){if(blob.size>16*MB)throw{code:'too_large'};input.base64Content={$file:{data:blob,name:'file.'+(extOf(name)||'bin'),type:mime||'application/octet-stream'}};}
    else{if(blob.size>600000)throw{code:'too_large'};input.base64Content=await blobToB64(blob);}

/* ===================== Blocco schermo ===================== */
let entered='';const lockEl=$('#lock');
function lockNow(){if(!lsGet('sow-pin',''))return;closeStart();entered='';renderLock();lockEl.hidden=false;}
function renderLock(msg){const d=new Date();
  const dots=h('div',{class:'pins'},[0,1,2,3,4,5].map(i=>h('i',{class:i<entered.length?'f':''})));
  const press=async(k)=>{if(k==='⌫'){entered=entered.slice(0,-1);renderLock();return;}if(k==='OK'){await tryUnlock();return;}if(entered.length<6){entered+=k;renderLock();if(entered.length>=4)await tryUnlock(true);}};
  lockEl.replaceChildren(h('div',{class:'lk-time'},pad(d.getHours())+':'+pad(d.getMinutes())),h('div',{class:'lk-date'},longDate(d)),dots,h('div',{class:'lk-msg',role:'status'},msg||'Inserisci il PIN'),
    h('div',{class:'pad'},['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(k=>h('button',{'aria-label':k==='⌫'?'Cancella':k==='OK'?'Conferma':k,onclick:()=>press(k)},k))));}
async function tryUnlock(silent){const ok=(await hashPin(entered))===lsGet('sow-pin','');
  if(ok){lockEl.hidden=true;entered='';lastAct=Date.now();return;}
  if(!silent||entered.length===6){entered='';renderLock('PIN errato');lockEl.querySelector('.pins').classList.add('bad');}}
document.addEventListener('keydown',e=>{if(lockEl.hidden)return;e.preventDefault();e.stopPropagation();
  if(/^\d$/.test(e.key)&&entered.length<6){entered+=e.key;renderLock();if(entered.length>=4)tryUnlock(true);}else if(e.key==='Backspace'){entered=entered.slice(0,-1);renderLock();}else if(e.key==='Enter')tryUnlock();},true);
let lastAct=Date.now();['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(lockEl.hidden)lastAct=Date.now();},true));

/* ===================== Notifiche ===================== */
let notifs=jGet('sow-notifs',[]);
function pushNotif(title,sub){notifs.unshift({t:Date.now(),title,sub,read:false});notifs=notifs.slice(0,40);jSet('sow-notifs',notifs);toast('🔔 '+title);renderBell();if(!$('#notif').hidden)renderNotif();}
function checkReminders(){const now=new Date(),today=isoDay(now);const done=jGet('sow-notified',{});let changed=false;
  S.maps.agenda.forEach((e,id)=>{if(!e.time||e.date!==today)return;const[hh,mm]=e.time.split(':').map(Number);const at=new Date(now.getFullYear(),now.getMonth(),now.getDate(),hh,mm);
    const diff=(at-now)/60000;if(diff<=15&&diff>-60&&!done[id+e.date+e.time]){done[id+e.date+e.time]=1;changed=true;pushNotif(e.title,diff>0?'Tra '+Math.ceil(diff)+' minuti, alle '+e.time:'Alle '+e.time);}});
  if(changed){for(const k of Object.keys(done))if(!k.includes(today))delete done[k];jSet('sow-notified',done);}}
function renderBell(){const n=notifs.filter(x=>!x.read).length;$('#bell').replaceChildren(ic('bell'),n?h('span',{class:'badge'},n>9?'9+':n):'');}
function renderNotif(){const p=$('#notif');const today=isoDay(new Date());const ev=nextEvents(today,today);
  p.replaceChildren(h('div',{class:'panel-scroll'},h('h2',{},'Oggi'),
    ev.length?ev.map(e=>h('div',{class:'nitem'},h('time',{style:'font-family:var(--mono);font-size:12px;color:var(--accent)'},e.time||'—'),h('div',{},e.title))):h('div',{class:'nitem'},h('span'),h('div',{style:'color:var(--muted)'},'Nessun impegno oggi.')),
    h('h2',{},'Avvisi'),notifs.length?notifs.map(n=>h('div',{class:'nitem'+(n.read?'':' new')},ic('bell'),h('div',{},n.title,h('small',{},n.sub+' · '+fmtDate(n.t))))):h('div',{class:'nitem'},h('span'),h('div',{style:'color:var(--muted)'},'Nessun avviso.'))),
    h('div',{class:'panel-foot'},h('button',{class:'btn',onclick:()=>{notifs.forEach(n=>n.read=true);jSet('sow-notifs',notifs);renderBell();renderNotif();}},'Segna come letti'),h('button',{class:'btn',onclick:()=>{notifs=[];jSet('sow-notifs',notifs);renderBell();renderNotif();}},'Cancella')));}
$('#bell').addEventListener('click',e=>{e.stopPropagation();closeStart();const p=$('#notif');p.hidden=!p.hidden;if(!p.hidden)renderNotif();});

/* ===================== Scrivania: icone e widget ===================== */
let iconSig='';
function renderIcons(){const apps=[...S.maps.apps.entries()].sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name),'it'));
  const sites=[...S.maps.bookmarks.entries()].filter(([,b])=>b.desk).sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name),'it'));
  const sig=apps.map(([id,m])=>id+m.name+m.color).join('|')+'#'+sites.map(([id,b])=>id+b.name+b.color).join('|');if(sig===iconSig&&$('#icons').children.length)return;iconSig=sig;
  const mk=(key,label,tile,open)=>{const b=h('button',{class:'dicon','data-k':key,title:label},tile,h('span',{class:'lbl'},label));iconDrag(b,key,open);return b;};
  const builtinIcons=BUILTIN.map(k=>mk(k,APPS[k].title,h('span',{class:'tile'},ic(APPS[k].icon)),()=>openApp(k)));
  const appIcons=apps.map(([id,m])=>mk('app:'+id,m.name,appTile(id),()=>openApp('run',{id})));
  const siteIcons=sites.map(([id,b])=>mk('bm:'+id,b.name,h('span',{class:'tile',style:'background:'+(b.color||COLORS[0])+';color:#fff'},ic('globe')),()=>openApp('browser',{url:b.url})));
  $('#icons').replaceChildren(...appIcons,...siteIcons,...builtinIcons);placeIcons();}
/* Posizione libera delle icone, ricordata su ogni dispositivo */
const ICON_W=88,ICON_H=98;
function placeIcons(){const box=$('#icons');const dw=desk.clientWidth,dh=desk.clientHeight;if(!dw||!dh)return;
  const pos=jGet('sow-iconpos',{});const left=Math.max(16,(window.innerWidth>0?0:0)+16);
  const taken=[];const els=[...box.children];
  els.forEach(el=>{const p=pos[el.dataset.k];if(p){const x=Math.min(Math.max(0,p.x*dw),dw-ICON_W),y=Math.min(Math.max(0,p.y*dh),dh-ICON_H);el.style.left=x+'px';el.style.top=y+'px';taken.push([x,y]);}});
  const free=(x,y)=>!taken.some(([a,b])=>Math.abs(a-x)<ICON_W-10&&Math.abs(b-y)<ICON_H-10);
  let col=0,row=0;const rows=Math.max(1,Math.floor((dh-16)/(ICON_H+4)));
  els.forEach(el=>{if(pos[el.dataset.k])return;let x,y,g=0;do{x=left+col*(ICON_W+6);y=16+row*(ICON_H+4);row++;if(row>=rows){row=0;col++;}}while(!free(x,y)&&g++<400);
    el.style.left=x+'px';el.style.top=y+'px';taken.push([x,y]);});}
function iconDrag(el,key,open){
  el.addEventListener('pointerdown',e=>{if(e.button!==0)return;const sx=e.clientX,sy=e.clientY,l=el.offsetLeft,t=el.offsetTop;let moved=false;
    el.setPointerCapture(e.pointerId);
    const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)<6)return;moved=true;el.classList.add('drag');
      el.style.left=Math.max(0,Math.min(desk.clientWidth-ICON_W,l+dx))+'px';el.style.top=Math.max(0,Math.min(desk.clientHeight-ICON_H,t+dy))+'px';};
    const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);el.classList.remove('drag');
      if(moved){const pos=jGet('sow-iconpos',{});pos[key]={x:el.offsetLeft/desk.clientWidth,y:el.offsetTop/desk.clientHeight};jSet('sow-iconpos',pos);el._skip=true;}};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);});
  el.addEventListener('click',e=>{if(el._skip){el._skip=false;e.preventDefault();return;}open();});}
function resetIcons(){lsDel('sow-iconpos');placeIcons();toast('Icone riordinate.');}
function renderWidgets(){const d=new Date(),today=isoDay(d),end=isoDay(new Date(d.getFullYear(),d.getMonth(),d.getDate()+7));
  const ev=nextEvents(today,end).filter(e=>e.date>today||!e.time||e.time>=pad(d.getHours())+':'+pad(d.getMinutes())).slice(0,5);
  const pins=[...S.maps.notes.values()].filter(n=>n.pinned&&n.text).sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,3);
  $('#widgets').replaceChildren(
    h('section',{class:'wg wg-clock'},h('b',{},pad(d.getHours())+':'+pad(d.getMinutes())),h('span',{},longDate(d))),
    h('section',{class:'wg'},h('h3',{},'Prossimi impegni'),ev.length?h('ul',{},ev.map(e=>{const dd=new Date(e.date+'T12:00:00');return h('li',{},h('time',{},(e.date===today?'oggi':pad(dd.getDate())+'/'+pad(dd.getMonth()+1))+(e.time?' '+e.time:'')),h('span',{},e.title));})):h('div',{class:'none'},'Nessun impegno nei prossimi 7 giorni.')),
    h('section',{class:'wg'},h('h3',{},'Note fissate'),pins.length?h('div',{style:'display:flex;flex-direction:column;gap:8px'},pins.map(n=>h('div',{class:'pin'},String(n.text).slice(0,220)))):h('div',{class:'none'},'Fissa una nota con la puntina per vederla qui.')));}

/* ===================== Start ===================== */
const sb=$('#startBtn');sb.append(ic('grid'),h('span',{},'Start'));const sm=$('#start');let sq='';let sIdx=0;

    if(sq.trim()){const r=searchAll(sq);sIdx=Math.min(sIdx,Math.max(0,r.length-1));

    if(apps.length){res.append(h('h2',{},'Le mie app'));apps.forEach(([id,m])=>res.append(h('button',{class:'sitem',role:'menuitem',onclick:()=>{closeStart();openApp('run',{id});}},appTile(id,true),h('div',{},m.name,h('small',{},'Versione '+(m.ver||1))))));}
    const sites=[...S.maps.bookmarks.entries()].filter(([,b])=>b.desk).sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name),'it'));
    if(sites.length){res.append(h('h2',{},'Siti'));sites.forEach(([id,b])=>res.append(h('button',{class:'sitem',role:'menuitem',onclick:()=>{closeStart();openApp('browser',{url:b.url});}},h('span',{class:'tile sm',style:'background:'+(b.color||COLORS[0])+';color:#fff'},ic('globe')),h('div',{},b.name,h('small',{},hostOf(b.url))))));}
    res.append(h('h2',{},'Sistema'));BUILTIN.forEach(k=>res.append(h('button',{class:'sitem',role:'menuitem',onclick:()=>{closeStart();openApp(k);}},ic(APPS[k].icon),h('div',{},APPS[k].title,h('small',{},APPS[k].desc)))));
    res.append(h('h2',{},'Finestre'),
      h('button',{class:'sitem',role:'menuitem',onclick:()=>{closeStart();arrange('tile');}},ic('tile'),h('div',{},'Affianca finestre',h('small',{},'Divide lo schermo tra le finestre aperte'))),
      h('button',{class:'sitem',role:'menuitem',onclick:()=>{closeStart();arrange('cascade');}},ic('layers'),h('div',{},'Sovrapponi a cascata',h('small',{},'Allinea le finestre una sull’altra'))),
      h('button',{class:'sitem',role:'menuitem',onclick:()=>{closeStart();resetIcons();}},ic('grid'),h('div',{},'Riordina icone',h('small',{},'Rimette le icone della scrivania in colonna'))),
      h('button',{class:'sitem',role:'menuitem',onclick:()=>{closeStart();wins.filter(w=>w.desk===curDesk).forEach(w=>{w.min=true;vis(w);});active=null;renderTasks();}},ic('min'),h('div',{},'Mostra scrivania',h('small',{},'Riduce tutte le finestre'))));};
  inp.addEventListener('input',()=>{sIdx=0;fill();});
  inp.addEventListener('keydown',e=>{const items=res.querySelectorAll('.sitem');if(e.key==='ArrowDown'){e.preventDefault();sIdx=Math.min(items.length-1,sIdx+1);fill();}
    else if(e.key==='ArrowUp'){e.preventDefault();sIdx=Math.max(0,sIdx-1);fill();}else if(e.key==='Enter'&&sq.trim()){const it=res.querySelectorAll('.sitem')[sIdx];if(it)it.click();}});
  const who=h('div',{class:'who'},U.avatar?h('img',{src:U.avatar,alt:''}):h('span',{class:'tile sm'},ic('grid')),h('div',{},h('b',{},U.name||'Sistema Operativo Web'),h('small',{},roleLabel()+' · versione '+VERSIONE_SISTEMA)));
  const foot=h('div',{class:'panel-foot'},h('button',{class:'btn',onclick:()=>{closeStart();openApp('settings');}},ic('gear'),'Impostazioni'),h('button',{class:'btn',onclick:()=>{closeStart();openApp('help');}},ic('help'),'Aiuto'),
    lsGet('sow-pin','')?h('button',{class:'btn',onclick:lockNow},ic('lock'),'Blocca'):null);
  const focused=document.activeElement&&sm.contains(document.activeElement)&&document.activeElement.type==='search';

function openStart(){$('#notif').hidden=true;sm.hidden=false;sb.setAttribute('aria-expanded','true');const inp=renderStart();if(!narrow.matches)inp.focus();}

/* ===================== Tastiera, orologio, avvio ===================== */
document.addEventListener('keydown',e=>{if(!lockEl.hidden)return;
  if(e.key==='Escape'){closeStart();closePops();$('#notif').hidden=true;}
  if(e.altKey&&(e.code==='Space')){e.preventDefault();sm.hidden?openStart():closeStart();}
  if(e.altKey&&e.code==='KeyQ'){e.preventDefault();cycleWin();}
  if(e.altKey&&/^Digit[1-4]$/.test(e.code)){e.preventDefault();switchDesk(+e.code.slice(5)-1);}});
function renderSync(){const b=$('#sync'),s=b.querySelector('span');b.className='trayb';
  if(S.mode==='loading')s.textContent='Connessione…';
  else if(S.mode==='local'){b.classList.add('warn');s.textContent='Solo su questo dispositivo';}
  else if(S.error){b.classList.add('err');s.textContent='Archivio non raggiungibile';}

let lastMin=-1;
